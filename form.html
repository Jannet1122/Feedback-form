<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="form.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <title>Feedback Form</title>
</head>
<body>
    <h1><b>Feedback Form</b></h1><br>
    <form>
        <label for="name">Name:</label><br><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label><br><br>
        <input type="email" id="email" name="email"><br><br>
        <label for="feedback">Feedback:</label><br><br>
        <textarea id="feedback" name="feedback" rows="5" placeholder="Please provide your feedback here..." required></textarea><br><br>
        <button id="submit" type="submit"><b>Submit</b></button>
        
        
    </form>
    <p id="confirmation"></p>
    <script src="form.js"></script>
    
</body>
</html>
